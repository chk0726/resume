<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>陳鴻凱 | Developer Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0b0f19;
  color:#fff;
  overflow-x:hidden;
}

/* 背景光 */
body::before{
  content:"";
  position:fixed;
  width:600px;
  height:600px;
  background:rgba(0,140,255,0.15);
  filter:blur(120px);
  top:-200px;
  right:-150px;
  z-index:-1;
}

body::after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:rgba(130,0,255,0.15);
  filter:blur(120px);
  bottom:-200px;
  left:-150px;
  z-index:-1;
}

/* NAV */
nav{
  width:100%;
  padding:25px 10%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.2);
  border-bottom:1px solid rgba(255,255,255,0.05);
  z-index:100;
}

nav h2{
  font-size:24px;
}

nav ul{
  display:flex;
  list-style:none;
  gap:30px;
}

nav a{
  color:#ccc;
  text-decoration:none;
}

nav a:hover{
  color:#4da3ff;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10%;
  gap:50px;
}

.hero-text{
  flex:1;
  animation:fadeUp 1s ease;
}

.hero-text h1{
  font-size:65px;
}

.hero-text span{
  color:#4da3ff;
}

.hero-text p{
  color:#aaa;
  margin:20px 0;
  line-height:1.8;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

/* BUTTON */
.buttons{
  display:flex;
  gap:20px;
}

.btn{
  padding:14px 28px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}

.primary{
  background:#4da3ff;
  color:white;
}

.secondary{
  border:1px solid #4da3ff;
  color:#4da3ff;
}

/* SLIDER */
.hero-image{
  flex:1;
  display:flex;
  justify-content:center;
}

.slider{
  position:relative;
  width:340px;
  height:340px;
  overflow:hidden;
  border-radius:30px;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:translateX(20px);
  transition:all 0.6s ease;
  border-radius:30px;
}

.slide.active{
  opacity:1;
  transform:translateX(0);
}

/* arrows */
.prev,.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.4);
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:10px;
  z-index:2;
}

.prev{left:10px;}
.next{right:10px;}

/* dots */
.dots{
  position:absolute;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:8px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  cursor:pointer;
}

.dot.active{
  background:#4da3ff;
}

/* SECTIONS */
section{
  padding:100px 10%;
}

.section-title{
  font-size:40px;
  margin-bottom:40px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:rgba(255,255,255,0.06);
  padding:30px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

/* SKILLS */
.skills{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.skill{
  padding:12px 20px;
  background:#111827;
  border-radius:12px;
}

/* CONTACT */
.contact-box{
  background:rgba(255,255,255,0.04);
  padding:40px;
  border-radius:20px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  color:#777;
}

</style>
</head>

<body>

<nav>
  <h2>HongKai.dev</h2>
  <ul>
    <li><a href="#about">關於</a></li>
    <li><a href="#skills">技能</a></li>
    <li><a href="#projects">作品</a></li>
    <li><a href="#contact">聯絡</a></li>
  </ul>
</nav>

<section class="hero">

  <div class="hero-text">
    <h1>Hi, I'm <span>陳鴻凱</span><br>Java Developer</h1>
    <p>逢甲大學統計系，專注 Java 與後端開發</p>

    <div class="buttons">
      <a class="btn primary" href="#projects">作品</a>
      <a class="btn secondary" href="#contact">聯絡</a>
    </div>
  </div>

  <div class="hero-image">

    <div class="slider">

      <img src="chkphoto.jpg" class="slide active">
      <img src="chkphoto2.jpg" class="slide">
      <img src="chkphoto3.jpg" class="slide">
      <img src="chkphoto4.jpg" class="slide">

      <button class="prev">❮</button>
      <button class="next">❯</button>

      <div class="dots"></div>

    </div>

  </div>

</section>

<section id="about">
  <h2 class="section-title">About</h2>

  <div class="cards">
    <div class="card">逢甲大學統計系</div>
    <div class="card">南山人壽 / 石二鍋</div>
    <div class="card">目標：Java工程師</div>
  </div>
</section>

<section id="skills">
  <h2 class="section-title">Skills</h2>
  <div class="skills">
    <div class="skill">Java</div>
    <div class="skill">HTML</div>
    <div class="skill">CSS</div>
    <div class="skill">GitHub</div>
  </div>
</section>

<section id="contact">
  <h2 class="section-title">Contact</h2>

  <div class="contact-box">
    📞 0906-338-721<br>
    📧 a0906338721@gmail.com
  </div>
</section>

<footer>© 2026 HongKai.dev</footer>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const slides = document.querySelectorAll(".slide");
  const dotsContainer = document.querySelector(".dots");
  const prev = document.querySelector(".prev");
  const next = document.querySelector(".next");

  let index = 0;
  let timer;

  // dots
  slides.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.classList.add("dot");
    if(i === 0) dot.classList.add("active");

    dot.onclick = () => go(i);
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll(".dot");

  function update(){
    slides.forEach((s,i)=>{
      s.classList.remove("active");
      dots[i].classList.remove("active");
    });

    slides[index].classList.add("active");
    dots[index].classList.add("active");
  }

  function go(i){
    index = i;
    update();
    reset();
  }

  function nextSlide(){
    index = (index + 1) % slides.length;
    update();
  }

  function prevSlide(){
    index = (index - 1 + slides.length) % slides.length;
    update();
  }

  next.onclick = () => { nextSlide(); reset(); }
  prev.onclick = () => { prevSlide(); reset(); }

  function auto(){
    timer = setInterval(nextSlide, 3000);
  }

  function reset(){
    clearInterval(timer);
    auto();
  }

  document.querySelector(".slider").addEventListener("mouseenter", ()=>{
    clearInterval(timer);
  });

  document.querySelector(".slider").addEventListener("mouseleave", auto);

  update();
  auto();

});

</script>

</body>
</html>
